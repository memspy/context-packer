<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"></stop>
      <stop offset="100%" stop-color="#7C3AED"></stop>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#g)"></rect>

  <!-- incoming context -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".9">
    <line x1="24" y1="40" x2="62" y2="40"></line>
    <line x1="24" y1="56" x2="62" y2="56"></line>
    <line x1="24" y1="72" x2="62" y2="72"></line>
    <line x1="24" y1="88" x2="62" y2="88"></line>
  </g>

  <!-- funnel -->
  <path d="M64 28
           C78 42 78 86 64 100
           C50 86 50 42 64 28" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"></path>

  <!-- packed artifact -->
