  <!-- code -->
  <path d="M84 57
           l-5 7
           5 7" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>

  <path d="M92 57
           l5 7
           -5 7" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>